        - generic [ref=e275]:
          - heading "正文" [level=2] [ref=e276]
          - generic [ref=e277]:
            - blockquote [ref=e278]:
              - paragraph [ref=e279]: “挂在循环上, 不写进循环里” — hook 在工具执行前后注入扩展逻辑。
            - paragraph [ref=e280]:
              - strong [ref=e281]: Hook
              - text: 是Harness中的重要一环，不写进循环，以扩展的形式注入循环中。
            - heading "名词解释" [level=2] [ref=e282]
            - paragraph [ref=e283]: Hook 这个词可以理解成： 钩子 / 挂钩 / 插入点 / 扩展点
            - paragraph [ref=e284]:
              - text: 最直观的翻译是：
              - strong [ref=e285]: 钩子
              - text: 。但不要把它想成“钓鱼钩”，而要把它想成：
            - paragraph [ref=e286]: 程序运行到某个关键位置时，提前留好的一个“可以挂东西的点”。
            - heading "hook 在agnet_loop里是什么意思？" [level=3] [ref=e287]
            - paragraph [ref=e288]: Agent 的主循环大概是：
            - paragraph [ref=e289]: :::color1 用户输入 → 调用 LLM → LLM 决定是否调用工具 → 工具执行前 → 执行工具
            - code [ref=e293]: ↓ 把结果交回 LLM ← 工具执行后
            - paragraph [ref=e294]: ":::"
            - paragraph [ref=e295]: "** 这里面有几个关键时刻，这些地方就可以留 hook：**"
            - paragraph [ref=e296]: :::color1 用户输入之后
            - paragraph [ref=e297]: 工具执行之前
            - paragraph [ref=e298]: 工具执行之后
            - paragraph [ref=e299]: Agent 准备停止之前
            - paragraph [ref=e300]: ":::"
            - separator [ref=e301]
            - paragraph [ref=e302]: 比如：
            - code [ref=e306]: "trigger_hooks(\"PreToolUse\", block) # 意思是： # 现在马上要执行工具了，所有注册在 PreToolUse 这个位置的 hook，都可以出来干活了。"
            - separator [ref=e307]
            - heading "在项目里，hook 的本质是什么？" [level=3] [ref=e308]
            - paragraph [ref=e309]: "** 本质上就是：某个事件发生时，自动调用一批提前注册好的函数。**"
            - paragraph [ref=e310]: 也就是：
            - code [ref=e314]: "HOOKS = { \"PreToolUse\": [], \"PostToolUse\": [], }"
            - paragraph [ref=e315]: 注册一个 hook：
            - code [ref=e319]: "def log_hook(block): print(\"即将执行工具:\", block.name) register_hook(\"PreToolUse\", log_hook)"
            - paragraph [ref=e320]: 触发 hook：
            - code [ref=e324]: trigger_hooks("PreToolUse", block)
            - paragraph [ref=e325]: 完整意思是：
            - paragraph [ref=e326]: 把 log_hook 这个函数挂到 PreToolUse 这个事件上。
            - paragraph [ref=e327]: 以后每次执行工具前，就自动调用 log_hook。
            - heading "动机" [level=2] [ref=e328]
            - paragraph [ref=e329]: 如果我们想给agent_loop额外添加几项功能，如 记录每次bash调用、记录操作后自动 git add，那么，每次新增功能都要修改 agent_loop 函数。
            - paragraph [ref=e330]: 循环很快就变成了这样：
            - code [ref=e334]: "def agent_loop(messages): while True: # ... LLM call ... for block in response.content: if block.type != \"tool_use\": continue log_to_file(block) # 加一行 check_permission(block) # 加一行 notify_slack(block) # 又加一行 output = execute(block) auto_git_add(block) # 再加一行 # ... 很快循环就认不出来了"
            - heading "hook构建" [level=2] [ref=e335]
            - paragraph [ref=e336]: 为了解决上述问题，故引入hook。
            - paragraph [ref=e337]: “hook 不写进循环里”不是说循环里完全没有 hook 相关代码，而是说具体扩展逻辑不写进循环里。
            - paragraph [ref=e338]: 循环只保留一个很薄的“挂点”：
            - code [ref=e342]: blocked = trigger_hooks("PreToolUse", block)
            - paragraph [ref=e343]: 真正的逻辑，比如权限检查、日志记录、大输出提醒，都写在外面的 hook 函数里，再注册进去：
            - code [ref=e347]: register_hook("PreToolUse", permission_hook) register_hook("PreToolUse", log_hook) register_hook("PostToolUse", large_output_hook)
            - paragraph [ref=e348]: 让循环只认识事件，不认识具体扩展：
            - code [ref=e352]: "def agent_loop(messages): while True: response = call_llm(messages) for block in response.content: if block.type != \"tool_use\": continue blocked = trigger_hooks(\"PreToolUse\", block) if blocked: continue output = execute_tool(block) trigger_hooks(\"PostToolUse\", block, output)"
            - paragraph [ref=e353]: 这时要加日志，不改循环：
            - code [ref=e357]: "def log_hook(block): print(\"准备执行工具:\", block.name) register_hook(\"PreToolUse\", log_hook)"
            - paragraph [ref=e358]: 要加权限检查，也不改循环：
            - code [ref=e362]: "def permission_hook(block): if block.name == \"bash\" and \"rm -rf\" in block.input[\"command\"]: return \"禁止危险命令\" return None register_hook(\"PreToolUse\", permission_hook)"
            - paragraph [ref=e363]: 要加执行后的检查，还是不改循环：
            - code [ref=e367]: "def large_output_hook(block, output): register_hook(\"PostToolUse\", large_output_hook) if len(output) > 100000: print(\"输出太大了\")"
            - heading "Hook示例-点外卖" [level=2] [ref=e368]
            - paragraph [ref=e369]: 一个更生活化的例子：假设你有一个“点外卖流程”。
            - paragraph [ref=e370]: 侵入式写法：
            - code [ref=e374]: "def order_food(): choose_restaurant() check_coupon() check_balance() log_order() notify_friend() pay() send_receipt()"
            - paragraph [ref=e375]: 后来每多一个需求，都要改 order_food()。
            - paragraph [ref=e376]: hook 写法：
            - code [ref=e380]: "def order_food(): choose_restaurant() trigger_hooks(\"BeforePay\") pay() trigger_hooks(\"AfterPay\")"
            - paragraph [ref=e381]: 外面想加什么就注册什么：
            - code [ref=e385]: register_hook("BeforePay", check_coupon) register_hook("BeforePay", check_balance) register_hook("BeforePay", log_order) register_hook("AfterPay", send_receipt) register_hook("AfterPay", notify_friend)
            - paragraph [ref=e386]: order_food() 不再关心“有哪些额外动作”，它只负责在关键节点喊一声：“现在到付款前了，谁要处理自己来。”
