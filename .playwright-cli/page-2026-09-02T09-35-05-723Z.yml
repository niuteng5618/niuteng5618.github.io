          - generic [ref=f4e255]:
            - heading "简介" [level=3] [ref=f4e256]
            - paragraph [ref=f4e257]:
              - text: SKILL在官方文档中强调了一个核心关键词：File-system based（基于文件系统），这项技术实际也就是
              - strong [ref=f4e258]: 基于文件系统的Agent
              - text: 。如何理解？要编写一个程序，并不一定所有代码都是我们自己写的。我们可能会通过 import xxx 来引入一些外部包，这些包存放在固定的位置（如 node_modules）。
            - paragraph [ref=f4e259]: 当程序需要调用这些包的能力时，就会从指定文件夹取出对应的代码然后执行。
            - paragraph [ref=f4e260]: Agent Skills 也是类似的逻辑，每个 Skill 都是一个实实在在存在的文件夹，它存放在一个固定的位置（如 .claude/skills）这个文件夹里装着下面几样东西：
            - list [ref=f4e261]:
              - listitem [ref=f4e262]:
                - strong [ref=f4e263]: 指令（SKILL.md）
                - text: ： 告诉 AI 怎么干活的 SOP（必选）。
              - listitem [ref=f4e264]:
                - strong [ref=f4e265]: 参考（reference）
                - text: ： 更详细的参考文档（可选）。
              - listitem [ref=f4e266]:
                - strong [ref=f4e267]: 脚本（scripts）
                - text: ： 比如 Python 代码，让 Skill 也能调用外部能力（可选）。
              - listitem [ref=f4e268]:
                - strong [ref=f4e269]: 资源（assets）
                - text: ：图片、模版等可能使用到的资源（可选）。
            - paragraph [ref=f4e270]
            - paragraph [ref=f4e271]: 其中，SKILL.md通过”—“划分文件的不同区域。且必须是”—“。头部必须包含yaml格式的name和description。
            - list [ref=f4e272]:
              - listitem [ref=f4e273]: • name 是它的唯一标识，起个简单好记的英文名字就行
              - listitem [ref=f4e274]: • description 描述这个 Skills 是做什么的，会被传入prompt中。
            - paragraph [ref=f4e275]
            - heading "核心机制——渐进式披露" [level=3] [ref=f4e276]
            - paragraph [ref=f4e277]:
              - text: skill会以tool的形式，加载到Agent的问答中。下方
              - strong [ref=f4e278]: description
              - text: 中会包含如何使用skill等默认提示词，以及当前可用的skill有哪些（只读取每个skill.md的name和description）
            - paragraph [ref=f4e279]
            - paragraph [ref=f4e280]: 第一层：先看目录（元数据 Metadata）
            - paragraph [ref=f4e281]
            - list [ref=f4e282]:
              - listitem [ref=f4e283]: • 什么时候加载？ 系统刚启动的时候。
              - listitem [ref=f4e284]: • 加载什么？ 加载每个技能的名字和一段简短的描述。
              - listitem [ref=f4e285]: • 有什么用？ 这一层占用的资源极少，可能就几百个 Token。它的作用就是告诉 Claude：“嘿，你的工具箱里有‘查周报’、‘处理 Excel’ 这几个工具哦。”
              - listitem [ref=f4e286]: • 结果： Claude 知道自己 “会什么”，但还不知道 “具体怎么做”。
            - separator [ref=f4e287]
            - paragraph [ref=f4e288]: 第二层：翻开手册（指令 Instructions）
            - paragraph [ref=f4e289]
            - list [ref=f4e290]:
              - listitem [ref=f4e291]: • 什么时候加载？ 当你说 “帮我把这个 Excel 处理一下” 的时候。
              - listitem [ref=f4e292]: • 加载什么？ 加载 “Excel 处理” 这个技能对应的SKILL.md。
              - listitem [ref=f4e293]: • 怎么加载？通过后台命令(bash、read等内置tool)。
              - listitem [ref=f4e294]: • 有什么用？ 只有在这个时候，那些详细的操作步骤、注意事项才会进入 AI 的脑子。
            - paragraph [ref=f4e295]: 第三层：动手干活（运行时资源 Runtime Resources）
            - paragraph [ref=f4e296]
            - list [ref=f4e297]:
              - listitem [ref=f4e298]:
                - text: • 什么时候加载？ 真正执行具体步骤的时候。加载什么？
                - list [ref=f4e299]:
                  - listitem [ref=f4e300]:
                    - text: ◦
                    - strong [ref=f4e301]: 参考（reference）
                    - text: ： 用户下达的任务可能是分析 Excel，也可能是创建 Excel，这两个操作可能有完全不同的处理步骤，详细的步骤不一定都在 SKILL.md 中，可以分开放在不同的参考文献（reference）下，当 Claude 识别到你要做的是分析 Excel 时，才会去查阅分析 Excel 的 reference。
                  - listitem [ref=f4e302]:
                    - text: ◦
                    - strong [ref=f4e303]: 脚本（scripts）
                    - text: ：Skill 中可以内置一些可执行的 Excel 处理脚本，在 SKILL.md 或者具体的参考文献（reference）下会告诉你应该调用以及如何调用这些脚本。还有最重要的一点，Claude 只需要按照指引执行脚本，而脚本本身的代码是不会塞给 AI 去读的，你完全不用担心一个超大代码文件会消耗 Token。
                    - list [ref=f4e304]:
                      - listitem [ref=f4e305]: ▪ 脚本文件本身不需要单独”读取内容”，LLM 从 SKILL.md 中得知入口脚本名（如 python calc.py –action factorial –n 10），然后通过 command 参数直接告诉 execute_skill_script 该执行什么。subprocess 自然就在 cwd=skill_dir 下找到并运行了那个脚本。
            - paragraph [ref=f4e306]: 这意味着：一个 Skill 可以打包整套说明文档、大量的执行脚本，但只要任务不需要，这些内容就永远不会占用上下文。
            - heading "官方SKILL" [level=3] [ref=f4e307]
            - paragraph [ref=f4e308]:
              - text: Anthropic 官方直接给我们提供了一个 生产 Skills 的 Skill：
              - link "Skill Creator" [ref=f4e309] [cursor=pointer]:
                - /url: https://zhida.zhihu.com/search?content_id=269700032&content_type=Article&match_order=1&q=Skill+Creator&zhida_source=entity
              - text: 。你不需要写一行代码或配置文件，只需要用自然语言告诉它你想做什么，它就会自动为你生成一个符合标准的 Skill 包。
            - paragraph [ref=f4e310]:
              - link "skills/skills/skill-creator at main · anthropics/skills" [ref=f4e311] [cursor=pointer]:
                - /url: https://github.com/anthropics/skills/tree/main/skills/skill-creator
