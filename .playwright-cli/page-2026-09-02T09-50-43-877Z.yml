            - heading "这是一份为您量身定制的标准化项目流程文档。本次更新已严格保留了您提供的所有细节，去除了 Mermaid 图表中的所有标题序号，并在核心部分为您配上了严谨的 LaTeX 公式。" [level=2] [ref=f1e292]
            - separator [ref=f1e293]
            - heading "检索增强生成系统标准流程文档" [level=1] [ref=f1e294]
            - heading "2.1 文档入库" [level=2] [ref=f1e295]
            - list [ref=f1e296]:
              - listitem [ref=f1e297]:
                - text: •
                - strong [ref=f1e298]: 哈希计算
                - text: ：对全文计算内容 Hash，用于唯一标识和变动追踪。
              - listitem [ref=f1e299]:
                - text: •
                - strong [ref=f1e300]: 倒排索引
                - text: ：构建文档的倒排索引，用于后续的 BM25 检索。
            - heading "2.2 向量嵌入" [level=2] [ref=f1e301]
            - list [ref=f1e302]:
              - listitem [ref=f1e303]:
                - text: •
                - strong [ref=f1e304]: 切分参数
                - text: ：设置 Chunk Size 为 900，Overlap 为 150。
              - listitem [ref=f1e305]:
                - text: •
                - strong [ref=f1e306]: 文档展开
                - text: ：使用
                - code [ref=f1e307]: markitdown
                - text: 按 Markdown 格式展开文档结构。
              - listitem [ref=f1e308]:
                - text: •
                - strong [ref=f1e309]: 边界断开策略
                - text: ：优先在 Markdown 结构边界断开（如标题、段落、代码块、分隔线等），严格避免在代码块内部切分。
              - listitem [ref=f1e310]:
                - text: •
                - strong [ref=f1e311]: 切分算法步骤
                - text: ：
            - blockquote [ref=f1e312]:
              - paragraph [ref=f1e313]:
                - strong [ref=f1e314]: 算法说明
                - text: ：这样即使某个断点是标题（结构分高），如果离目标太远也会被惩罚；反过来，离目标很近但结构很弱的断点也不会轻易胜出。综合起来就是“兼顾结构边界与长度目标”。
            - code [ref=f1e318]: "- 先把所有可能断点打“结构分”（例如：标题得分高、空行得分低等）。 - 当文本长度接近目标长度时，在一个“回看窗口”内挑出候选断点。 - 对每个断点再加“距离惩罚”：离目标长度越远分数越低，离目标越近分数越高。 - 最终用 **“结构分 × 距离衰减系数”** 选出最佳断点。 + **向量生成与存储**：为每个 Chunk 生成持久化向量。采用 `float32` 数据类型，向量维度为 1024，嵌入模型使用 `qwen3-0.6b-Embedding`。向量数据全量存储到 Milvus 数据库。"
            - heading "2.3 查询步骤" [level=2] [ref=f1e319]
            - paragraph [ref=f1e320]: 用户输入文本 Query 后，系统开始执行查询流水线。
            - heading "2.3.1 强信号验证" [level=3] [ref=f1e321]
            - paragraph [ref=f1e322]: 先做一次 BM25 检测快速计算结果。若结果为强信号，直接跳到 RRF 融合步骤。
            - list [ref=f1e323]:
              - listitem [ref=f1e324]:
                - text: •
                - strong [ref=f1e325]: 强信号定义
                - text: ：Top 1 得分高（
                - img "image" [ref=f1e326]
                - text: ）且与 Top 2 拉开明显差距（
                - img "image" [ref=f1e327]
                - text: ），视为“强信号”，可跳过后续查询扩展以节省成本。
            - heading "2.3.2 查询扩展" [level=3] [ref=f1e328]
            - paragraph [ref=f1e329]: 调用大模型生成以下扩展内容：
            - list [ref=f1e330]:
              - listitem [ref=f1e331]:
                - text: •
                - strong [ref=f1e332]: Lex
                - text: ：关键词组合。
              - listitem [ref=f1e333]:
                - text: •
                - strong [ref=f1e334]: Vec
                - text: ：将问题用自然语言重述。
              - listitem [ref=f1e335]:
                - text: •
                - strong [ref=f1e336]: Hyde
                - text: ：生成假设性答案（Query 的假设结果）。
            - heading "2.3.3 计算" [level=3] [ref=f1e337]
            - paragraph [ref=f1e338]: 分为 4 条分支进行计算：Lex、Vec、Hyde、原始 Query。
            - list [ref=f1e339]:
              - listitem [ref=f1e340]:
                - text: •
                - strong [ref=f1e341]: 计算方式分配
                - text: ：
                - list [ref=f1e342]:
                  - listitem [ref=f1e343]:
                    - text: ◦
                    - strong [ref=f1e344]: Lex
                    - text: ：仅参与 BM25 计算。
                  - listitem [ref=f1e345]:
                    - text: ◦
                    - strong [ref=f1e346]: Vec、Hyde
                    - text: ：参与向量相似度计算。
                  - listitem [ref=f1e347]:
                    - text: ◦
                    - strong [ref=f1e348]: 原始 Query
