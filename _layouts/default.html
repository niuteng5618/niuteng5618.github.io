<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    <div class="site-bg-decoration" aria-hidden="true"></div>
    {% include nav.html %}

    <button class="rail-collapse-button" id="railCollapseButton" type="button" aria-label="收起博客目录">收起</button>
    <aside class="right-rail" id="rightRail">
      {% include blog-directory.html variant="rail" %}
    </aside>

    <div id="main" role="main" class="wrapper-content with-right-rail">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}
  </body>

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>
  </div>
  {% include theme-toggle.html %}
  {% include back-to-top.html %}
  {% include image-lightbox.html %}
  <script src="{{ site.baseurl }}/js/site-interactions.js"></script>

</html>
