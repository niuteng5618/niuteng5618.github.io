<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    <div class="site-bg-decoration" aria-hidden="true"></div>
    {% include nav.html %}

    <aside class="right-rail">
      {% include blog-directory.html %}

      {% if page.toc==true %}
        <section class="post-toc">
          <h2>本文目录</h2>
          {% include toc.html html=content %}
        </section>
      {% endif %}
    </aside>

    <div id="main" role="main" class="wrapper-content with-right-rail">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}
  </body>

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>
  </div>
  {% include theme-toggle.html %}
  {% include back-to-top.html %}
  <script src="{{ site.baseurl }}/js/site-interactions.js"></script>

</html>
